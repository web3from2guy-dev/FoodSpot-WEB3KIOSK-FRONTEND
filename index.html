<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>The Food Spot — Kiosk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.8.1/dist/ethers.umd.min.js"></script>
  <style>body{font-family:Inter,ui-sans-serif,system-ui;background:#0b1220;color:#e6eef8}</style>
</head>
<body class="min-h-screen">
  <header class="bg-gray-800 p-6 text-center">
    <a href="../index.html" class="absolute left-4 top-6 text-gray-400 hover:text-white"><i class="fas fa-arrow-left"></i> Back</a>
    <h1 id="store-title" class="text-3xl font-extrabold text-yellow-400">The Food Spot</h1>
  </header>

  <main class="container mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-8">
    <section class="lg:col-span-2">
      <h2 class="text-2xl text-indigo-300 mb-4">Our Menu</h2>
      <div id="menu-items" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>

    <aside class="bg-gray-800 p-4 rounded lg:col-span-1">
      <h3 class="text-xl text-green-300 mb-4">Your Order</h3>
      <div id="order-list" class="space-y-3 min-h-[120px]">
        <p class="text-gray-400">No items yet.</p>
      </div>
      <div class="mt-4">
        <div class="flex justify-between mb-2"><span>Total</span><span id="total-usd">$0.00</span></div>
        <div class="flex justify-between mb-4"><span>Total (USDC)</span><span id="total-usdc">0.00 USDC</span></div>
        <button id="pay-btn" class="w-full py-3 bg-indigo-600 rounded text-white disabled:opacity-50" disabled><i class="fas fa-wallet mr-2"></i>Pay with Polygon</button>
      </div>
    </aside>
  </main>

<script>
const STORAGE_KEY = 'foodSpotConfig_v1';

function readConfig() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch(e){ return null; }
}

let cfg = readConfig();
if (!cfg) {
  // no config — inform user
  document.getElementById('menu-items').innerHTML = '<div class="p-6 bg-gray-700 rounded">This kiosk has not been configured yet. Please ask the owner to complete setup in the admin panel.</div>';
} else {
  document.getElementById('store-title').textContent = cfg.storeName || 'The Food Spot';
  const products = cfg.products || [];
  renderProducts(products);
}

let cart = {};
function renderProducts(products) {
  const container = document.getElementById('menu-items');
  container.innerHTML = '';
  if (!products || products.length === 0) {
    container.innerHTML = '<div class="p-6 bg-gray-700 rounded">No products configured.</div>';
    return;
  }
  products.forEach(p => {
    const card = document.createElement('div');
    card.className = 'bg-gray-700 p-4 rounded';
    card.innerHTML = `
      <img src="${p.imageUrl || 'https://placehold.co/400x200/4a5568/a0aec0?text=No+Image'}" class="w-full h-36 object-cover rounded mb-3"/>
      <h4 class="font-semibold text-white">${p.name}</h4>
      <p class="text-gray-300 text-sm mb-2">${p.description || ''}</p>
      <div class="flex justify-between items-center">
        <div class="text-yellow-300 font-bold">$${Number(p.price||0).toFixed(2)}</div>
        <button class="add-btn px-3 py-2 bg-indigo-500 rounded text-white" data-id="${p.id}">Add</button>
      </div>
    `;
    container.appendChild(card);
  });

  document.querySelectorAll('.add-btn').forEach(b => {
    b.addEventListener('click', (e) => {
      const id = e.currentTarget.dataset.id;
      addToCart(id);
    });
  });
}

function addToCart(itemId) {
  const product = (cfg.products||[]).find(x=>x.id===itemId);
  if (!product) return;
  cart[itemId] = (cart[itemId]||0) + 1;
  updateCartUI();
}

function removeFromCart(itemId) {
  if (!cart[itemId]) return;
  cart[itemId]--;
  if (cart[itemId] <= 0) delete cart[itemId];
  updateCartUI();
}

function updateCartUI(){
  const orderList = document.getElementById('order-list');
  orderList.innerHTML = '';
  const items = Object.keys(cart);
  if (items.length === 0) {
    orderList.innerHTML = '<p class="text-gray-400">No items yet.</p>';
    document.getElementById('pay-btn').disabled = true;
    document.getElementById('total-usd').textContent = '$0.00';
    document.getElementById('total-usdc').textContent = '0.00 USDC';
    return;
  }
  let total = 0;
  items.forEach(id => {
    const qty = cart[id];
    const prod = (cfg.products||[]).find(p=>p.id===id);
    if (!prod) return;
    total += prod.price * qty;
    const row = document.createElement('div');
    row.className = 'flex justify-between items-center bg-gray-800 p-2 rounded';
    row.innerHTML = `
      <div>
        <div class="font-semibold">${prod.name} x ${qty}</div>
        <div class="text-xs text-gray-400">$${prod.price.toFixed(2)} each</div>
      </div>
      <div class="text-right">
        <div class="font-semibold">$${(prod.price*qty).toFixed(2)}</div>
        <button class="text-red-400 remove-btn text-sm" data-id="${id}">Remove</button>
      </div>
    `;
    orderList.appendChild(row);
  });
  document.querySelectorAll('.remove-btn').forEach(b=>b.addEventListener('click', e=>removeFromCart(e.currentTarget.dataset.id)));
  document.getElementById('total-usd').textContent = '$' + total.toFixed(2);
  document.getElementById('total-usdc').textContent = total.toFixed(2) + ' USDC';
  document.getElementById('pay-btn').disabled = false;
}

/* === Polygon payment code (unchanged) === */
const polygonChainId = '0x89'; // polygon mainnet (change for testnet)
const paymentAddress = "0x5093873aa4ec1a9a9eba26e26e41cfb13b35cbba"; // replace with your payment address
const usdcContractAddress = "0x2791Bca1f2de4661ED88A30C99A7a9449Aa84174";
const usdcAbi = ["function transfer(address to, uint256 amount) returns (bool)"];

async function isMetaMaskInstalled() {
  return typeof window.ethereum !== 'undefined';
}

async function switchNetworkToPolygon() {
  try {
    await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: polygonChainId }]});
  } catch (err) {
    if (err.code === 4902) {
      await window.ethereum.request({
        method: 'wallet_addEthereumChain',
        params:[{
          chainId: polygonChainId,
          chainName: 'Polygon Mainnet',
          rpcUrls: ['https://polygon-rpc.com/'],
          nativeCurrency: {name:'MATIC',symbol:'MATIC',decimals:18},
          blockExplorerUrls:['https://polygonscan.com/']
        }]
      });
    } else {
      throw err;
    }
  }
}

document.getElementById('pay-btn').addEventListener('click', async () => {
  const totalUSD = parseFloat(document.getElementById('total-usd').textContent.replace('$','')) || 0;
  if (totalUSD <= 0) return alert('Cart is empty');

  if (!await isMetaMaskInstalled()) return alert('MetaMask not installed.');

  try {
    document.getElementById('pay-btn').textContent = 'Connecting...';
    await window.ethereum.request({ method: 'eth_requestAccounts' });
    await switchNetworkToPolygon();
    const provider = new ethers.BrowserProvider(window.ethereum);
    const signer = await provider.getSigner();
    const usdc = new ethers.Contract(usdcContractAddress, usdcAbi, signer);
    const amount = ethers.parseUnits(totalUSD.toFixed(2), 6); // USDC 6 decimals
    const tx = await usdc.transfer(paymentAddress, amount);
    await tx.wait();
    alert('Payment successful — thank you!');
    // create a simple order and store in config (optional)
    const order = {
      id: 'ord_' + Math.random().toString(36).slice(2,9),
      timestamp: new Date().toLocaleString(),
      items: Object.keys(cart).map(id => {
        const p = cfg.products.find(x=>x.id===id);
        return { id, name: p.name, price: p.price, quantity: cart[id] };
      }),
      total: totalUSD,
      status: 'new'
    };
    // save to config orders
    cfg.orders = cfg.orders || [];
    cfg.orders.push(order);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg)); // persist
    cart = {}; updateCartUI();
  } catch (err) {
    console.error(err);
    alert('Payment failed: ' + (err.message||err));
  } finally {
    document.getElementById('pay-btn').textContent = 'Pay with Polygon';
  }
});
</script>
</body>
</html>
